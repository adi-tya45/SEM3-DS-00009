<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
    <link rel="stylesheet" href="studentinfo.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">Student Information Management System</h1>
        <div class="childcontainer">
            <label for="">Enter the Name: </label>
            <input type="text" id="name"><br><br>
            <label for="">Enter the Department: </label>
            <input type="text" id="department"><br><br>
            <label for="">Enter the Roll No.: </label>
            <input type="number" id="rollno"><br><br>
            <label for="">Enter the Grades: </label><br>
            <input type="number" class="grades" id="grade_5"><br><br>
            <input type="number" name="" class="grades"  id="grade_1"><br><br>
            <input type="number" name="" class="grades"  id="grade_2"><br><br>
            <input type="number" name="" class="grades"  id="grade_3"><br><br>
            <input type="number" name="" class="grades"  id="grade_4"><br><br>
            <button id="calculate"> Calculate</button>
            
        </div>
        <div class="result">

        </div>
    </div>


    <script src="studentinfo.js"></script>
</body>
</html>
